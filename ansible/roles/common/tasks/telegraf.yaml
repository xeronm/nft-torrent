- name: "RedHat: InfluxDB Repository"
  yum_repository:
    name: influxdb
    description: InfluxDB Repository - RHEL
    baseurl: https://repos.influxdata.com/rhel/$releasever/$basearch/stable
    gpgkey:  https://repos.influxdata.com/influxdata-archive_compat.key
    gpgcheck: yes
    enabled: yes
  when: ansible_os_family == "RedHat"
  tags: telegraf

- name: "Debian: Download influxdata archive key"
  ansible.builtin.get_url:
    url: https://repos.influxdata.com/influxdata-archive.key
    dest: /tmp/influxdata-archive.key
    mode: '0644'
  when: ansible_os_family == "Debian"
  tags: telegraf

- name: "Debian: Convert influxdata archive key to GPG format"
  ansible.builtin.command:
    cmd: gpg --dearmor -o /etc/apt/trusted.gpg.d/influxdata-archive.gpg /tmp/influxdata-archive.key
  args:
    creates: /etc/apt/trusted.gpg.d/influxdata-archive.gpg
  when: ansible_os_family == "Debian"
  tags: telegraf

- name: "Debian: Add influxdata APT repository"
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/trusted.gpg.d/influxdata-archive.gpg] https://repos.influxdata.com/debian stable main"
    state: present
    filename: influxdata
  when: ansible_os_family == "Debian"
  tags: telegraf

- name: '"telegraf" config path'
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: 0755
  with_items:
    - /etc/telegraf
  tags: telegraf

- name: '"telegraf" package present'
  dnf:
    name: telegraf
    state: present
  tags: telegraf

- name: '"telegraf" is configured'
  template:
    src: "./etc/telegraf/telegraf.conf.j2"
    dest: /etc/telegraf/telegraf.conf
    owner: telegraf
    group: telegraf
    mode: 0600
  notify:
    - restart telegraf
  tags: telegraf

- name: '"telegraf" service'
  include_role:
    name: common
    tasks_from: service
  vars:
    service:
      name: telegraf
      package: telegraf
      params: "{{ telegraf.service_params }}"
  tags: telegraf

- name: adding existing user 'telegraf' to group 'docker'
  user:
    name: telegraf
    groups: docker
    append: yes
  tags: telegraf