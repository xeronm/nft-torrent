    server {
        listen       443 ssl http2;
        listen       [::]:443 ssl http2;
        server_name  s.petsmem.site;
        root         /usr/share/nginx/html;

        ssl_certificate /etc/pki/tls/certs/petsmem.site/fullchain.pem;
        ssl_certificate_key /etc/pki/tls/private/petsmem.site/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout  10m;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
        ssl_prefer_server_ciphers on;
        ssl_ecdh_curve X25519:secp384r1;

        limit_conn perip 20;

        # Load configuration files for the default server block.
        include /etc/nginx/s.petsmem.d/*.conf;

        location /api/v1 {
            access_log      /var/log/nginx/s.petsmem-api-access.log main;
            proxy_pass      http://127.0.0.1:8002;
            limit_req       zone=perip_rps burst=25;
        }

        location /c {
            access_log      /var/log/nginx/s.petsmem-c-access.log main;
            proxy_pass      http://127.0.0.1:8002;
            limit_req       zone=perip_rps burst=25;
            proxy_cache     cache;
        }

        location /api/v1/collection {
            access_log      /var/log/nginx/s.petsmem-api-access.log main;
            proxy_pass      http://127.0.0.1:8002;
            limit_req       zone=perip_rps;
            proxy_cache     cache;
        }

        error_page 404 /404.html;
            location = /40x.html {
        }

        error_page 500 502 503 504 /50x.html;
            location = /50x.html {
        }
    }