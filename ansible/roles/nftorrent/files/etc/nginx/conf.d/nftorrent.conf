    server {
        listen       443 ssl http2;
        listen       [::]:443 ssl http2;
        server_name  s.petsmem.site;
        root         /usr/share/nginx/html;

        ssl_certificate /etc/letsencrypt/live/petsmem.site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/petsmem.site/privkey.pem;

        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout  10m;
        ssl_ciphers PROFILE=SYSTEM;
        ssl_prefer_server_ciphers on;

        # Load configuration files for the default server block.
        include /etc/nginx/s.petsmem.d/*.conf;

        location /api/v1 {
            access_log      /var/log/nginx/s.petsmem-api-access.log main;
            proxy_pass      http://127.0.0.1:8002;
            limit_req       zone=perip5rps burst=10;
        }

        location /c {
            access_log      /var/log/nginx/s.petsmem-c-access.log main;
            proxy_pass      http://127.0.0.1:8002;
            limit_req       zone=perip5rps burst=6;
        }

        error_page 404 /404.html;
            location = /40x.html {
        }

        error_page 500 502 503 504 /50x.html;
            location = /50x.html {
        }
    }