    upstream backend {
        server 127.0.0.1:8002 max_fails=2 fail_timeout=5s;
    }

    upstream fallback_peers {
{% for host in groups[inventory_group] %}
{%   if hostvars[host].get('local_domain') is defined and hostvars[host].get('local_domain') and hostvars[host].get('local_domain') != local_domain %}
        server {{ hostvars[host].get('local_domain') }}:443;
{%   endif %}
{% endfor %}
    }


    server {
        listen       443 ssl http2;
        listen       [::]:443 ssl http2;
        server_name  {{ local_domain }} w.petsmem.site s.petsmem.site;
        set          $this_node {{ local_domain }};
        root         /usr/share/nginx/html;

        ssl_certificate /etc/pki/tls/certs/petsmem.site/fullchain.pem;
        ssl_certificate_key /etc/pki/tls/private/petsmem.site/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout  10m;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
        ssl_prefer_server_ciphers on;
        ssl_ecdh_curve X25519:secp384r1;

        limit_conn perip 25;

        # Load configuration files for the default server block.
        include /etc/nginx/petsmem.d/*.conf;

        # static
        location / {
            if ($host = s.petsmem.site) {
                return 404;
            }
            try_files $uri $uri/ /index.html;
        }

        # Backend API
        location /api/v1 {
            access_log      /var/log/nginx/petsmem-api-access.log main;

            add_header      X-Country-Code $geoip2_country_code always;
            add_header      'Access-Control-Expose-Headers' 'X-Country-Code' always;

            proxy_pass      http://backend;
            proxy_set_header X-Country-Code $geoip2_country_code;

            limit_req       zone=perip_rps burst=20 nodelay;
            client_max_body_size 10M;
        }

        location /c {
            access_log      /var/log/nginx/petsmem-c-access.log main;

            proxy_pass      http://backend;
            proxy_set_header X-Country-Code $geoip2_country_code;

            proxy_cache     cache;
            proxy_cache_key "$scheme$host$request_uri$http_origin";

            limit_req       zone=perip_rps_high burst=40 nodelay;

            # For query content we try to avoid transport or backend errors;
            error_page 502 503 504 = @be_fallback;
        }

        location @be_fallback {
            if ($http_x_be_fallback != "") {
                return 502;
            }

            proxy_pass https://fallback_peers;
            proxy_set_header X-Be-Fallback "1";
            proxy_set_header Host s.petsmem.site;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_ssl_server_name on;

            limit_req       zone=perip_rps_high burst=40 nodelay;
        }

        location /api/v1/collection {
            access_log      /var/log/nginx/petsmem-api-access.log main;

            add_header      X-Country-Code $geoip2_country_code always;
            add_header      'Access-Control-Expose-Headers' 'X-Country-Code' always;

            proxy_pass      http://backend;
            proxy_set_header X-Country-Code $geoip2_country_code;

            proxy_cache     cache;
            proxy_cache_key "$scheme$host$request_uri$http_origin";

            limit_req       zone=perip_rps burst=20 nodelay;
        }


        error_page 404 /404.html;
            location = /40x.html {
        }

        error_page 500 502 503 504 /50x.html;
            location = /50x.html {
        }
    }