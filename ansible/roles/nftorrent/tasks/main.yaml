- name: NFTorrent root "~/nft-torrent"
  file:
    path: "/home/{{ oam.user }}/nft-torrent"
    state: directory
    owner: "{{ oam.user }}"
    group: "{{ oam.group }}"
    mode: '0755'
  tags: nftorrent

- name: NFTorrent python package
  copy:
    src: "{{ nftorrent.package }}"
    dest: "/home/{{ oam.user }}/nft-torrent"
    owner: "{{ oam.user }}"
    group: "{{ oam.group }}"
  tags: nftorrent

- name: NFTorrent Assets "~/nft-torrent/assets"
  copy:
    src: ./assets
    dest: "/home/{{ oam.user }}/nft-torrent/"
    owner: "{{ oam.user }}"
    group: "{{ oam.group }}"
  tags: nftorrent

- name: NFTorrent required paths
  file:
    path: "/home/{{ oam.user }}/nft-torrent/{{ item }}"
    state: directory
    owner: "{{ oam.user }}"
    group: "{{ oam.group }}"
    mode: '0750'
  loop:
    - private
    - log
  tags: nftorrent

- name: NFTorrent private "~/nft-torrent/private/certs"
  file:
    path: "/home/{{ oam.user }}/nft-torrent/private/certs"
    state: directory
    owner: "{{ oam.user }}"
    group: "{{ oam.group }}"
    mode: '0750'
  tags: nftorrent

- name: Copy CA public certificate for PG-Cluster
  copy:
    src: "./certs/pgcluster/ca.crt"
    dest: /home/{{ oam.user }}/nft-torrent/private/certs/ca.crt
    owner: root
    group: root
    mode: '0644'
  tags: nftorrent

- name: Copy etcd Client public certificate for PG-Cluster
  copy:
    src: "./certs/pgcluster/client.crt"
    dest: /home/{{ oam.user }}/nft-torrent/private/certs/client.crt
    owner: "{{ oam.user }}"
    group: "{{ oam.group }}"
    mode: '0644'
  tags: nftorrent

- name: Copy etcd Client puprivate key for PG-Cluster
  copy:
    src: "./certs/pgcluster/client.key"
    dest: /home/{{ oam.user }}/nft-torrent/private/certs/client.key
    owner: "{{ oam.user }}"
    group: "{{ oam.group }}"
    mode: '0600'
  tags: nftorrent

- name: NFTorrent private JWT Key
  copy:
    content: "{{ nftorrent.jwt_key }}"
    dest: "/home/{{ oam.user }}/nft-torrent/private/jwt.key"
    owner: "{{ oam.user }}"
    group: "{{ oam.group }}"
    mode: '0400'
  notify: restart nftorrent
  tags: nftorrent

- name: NFTorrent TWA Bot token
  copy:
    content: "{{ nftorrent.bot_token }}"
    dest: "/home/{{ oam.user }}/nft-torrent/private/bot_token.key"
    owner: "{{ oam.user }}"
    group: "{{ oam.group }}"
    mode: '0400'
  notify: restart nftorrent
  tags: nftorrent

- name: NFTorrent DB Password
  copy:
    content: "{{ pg_users.postgres.password }}"
    dest: "/home/{{ oam.user }}/nft-torrent/private/db_password"
    owner: "{{ oam.user }}"
    group: "{{ oam.group }}"
    mode: '0400'
  notify: restart nftorrent
  tags: nftorrent

- name: NFTorrent tonlib keystore "~/nft-torrent/ton_keystore"
  file:
    path: "/home/{{ oam.user }}/nft-torrent/ton_keystore"
    state: directory
    owner: "{{ oam.user }}"
    group: "{{ oam.group }}"
    mode: '0750'
  tags: nftorrent

- name: NFTorrent IPFS storage "~/nft-torrent/ipfs-db"
  file:
    path: "/home/{{ oam.user }}/nft-torrent/ipfs-db"
    state: directory
    owner: "{{ oam.user }}"
    group: "{{ oam.group }}"
    mode: '0750'
  tags: nftorrent

- name: NFTorrent IPFS storage "~/nft-torrent/cluster-db"
  file:
    path: "/home/{{ oam.user }}/nft-torrent/cluster-db"
    state: directory
    owner: "{{ oam.user }}"
    group: "{{ oam.group }}"
    mode: '0750'
  tags: nftorrent

- name: NFTorrent docker-compose
  copy:
    src: ./docker-compose.yaml
    dest: "/home/{{ oam.user }}/nft-torrent/docker-compose.yaml"
    owner: "{{ oam.user }}"
    group: "{{ oam.group }}"
    mode: '0640'
  notify: restart nftorrent
  tags: nftorrent

- name: NFTorrent docker-compose environment
  template:
    src: ./env.j2
    dest: "/home/{{ oam.user }}/nft-torrent/.env"
    owner: "{{ oam.user }}"
    group: "{{ oam.group }}"
    mode: '0600'
  notify: restart nftorrent
  tags: nftorrent

- name: NFTorrent Collections
  template:
    src: ./nftcollections.py.j2
    dest: "/home/{{ oam.user }}/nft-torrent/nftcollections.py"
    owner: "{{ oam.user }}"
    group: "{{ oam.group }}"
    mode: '0664'
  notify: restart nftorrent
  tags: nftorrent

- name: Download TON Blockchain Config
  ansible.builtin.get_url:
    url: https://ton.org/testnet-global-config.json
    dest: /home/{{ oam.user }}/nft-torrent/private/testnet-global-config.json
    owner: "{{ oam.user }}"
    group: "{{ oam.group }}"
    mode: '0440'
  tags: nftorrent

- name: NFTorrent docker service
  community.docker.docker_compose_v2:
    project_name: nft-torrent
    project_src: "/home/{{ oam.user }}/nft-torrent"
    state: present
  tags: nftorrent

- name: IPFS Setup
  include_tasks:
    file: ipfs.yaml
    apply:
      tags: nftorrent
  tags:
    - nftorrent
    - ipfs

- name: NFTorrent Telegraf is configured
  copy:
    src: ./etc/telegraf/telegraf.d/nftorrent.conf
    dest: /etc/telegraf/telegraf.d/nftorrent.conf
    owner: root
    group: root
    mode: 0644
  notify:
    - restart telegraf
  tags: nftorrent

- name: NFTorrent Nginx is configured
  template:
    src: ./etc/nginx/conf.d/nftorrent.j2.conf
    dest: /etc/nginx/conf.d/nftorrent.conf
    owner: root
    group: root
    mode: 0644
  notify:
    - restart nginx
  tags: nftorrent
