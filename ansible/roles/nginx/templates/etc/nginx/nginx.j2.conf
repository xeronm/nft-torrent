# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr[$http_x_real_ip] - $remote_user [$time_local] $host "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_origin" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'cache:$upstream_cache_status acao:$upstream_http_access_control_allow_origin';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    client_header_timeout 240;
    client_body_timeout 600;
    types_hash_max_size 2048;
    reset_timedout_connection on;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    # See http://nginx.org/en/docs/ngx_core_module.html#include
    # for more information.
    include /etc/nginx/conf.d/*.conf;

    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_zone $binary_remote_addr zone=perip_rps:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=perip_rps_high:10m rate=20r/s;
    proxy_cache_path /var/cache/nginx keys_zone=cache:10m;

    map $http_x_real_ip $client_ip {
        default         $http_x_real_ip;
        ""              $remote_addr;
    }

    server {
        listen       80 default_server;
        listen       [::]:80 default_server;
        server_name  _;

        return 301 https://$host$request_uri;
    }

    server {
        listen       127.0.0.1:8008;

        location /server_status {
            stub_status;
        }

    }

    server {
        listen       443 ssl http2;
        listen       [::]:443 ssl http2;
        server_name  www.{{ ssl_domain }};
        root         /usr/share/nginx/html;

        ssl_certificate /etc/pki/tls/certs/{{ ssl_domain }}/fullchain.pem;
        ssl_certificate_key /etc/pki/tls/private/{{ ssl_domain }}/privkey.pem;

        return 301 https://{{ ssl_domain }}$request_uri;
    }

    server {
        listen       443 ssl http2 default_server;
        listen       [::]:443 ssl http2 default_server;
        server_name  {{ ssl_domain }};
        root         /usr/share/nginx/html;

        ssl_certificate /etc/pki/tls/certs/{{ ssl_domain }}/fullchain.pem;
        ssl_certificate_key /etc/pki/tls/private/{{ ssl_domain }}/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout  10m;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
        ssl_prefer_server_ciphers on;
        ssl_ecdh_curve X25519:secp384r1;

        limit_conn perip 15;

        # Load configuration files for the default server block.
        include /etc/nginx/default.d/*.conf;

        # static
        location / {
            try_files $uri $uri/ /index.html;
        }

        error_page 404 /404.html;
            location = /40x.html {
        }

        error_page 500 502 503 504 /50x.html;
            location = /50x.html {
        }
    }

    server {
        listen       443 ssl http2;
        listen       [::]:443 ssl http2;
        server_name  testnet.{{ ssl_domain }};
        root         /usr/share/nginx/html_testnet;

        ssl_certificate /etc/pki/tls/certs/{{ ssl_domain }}/fullchain.pem;
        ssl_certificate_key /etc/pki/tls/private/{{ ssl_domain }}/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout  10m;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
        ssl_prefer_server_ciphers on;
        ssl_ecdh_curve X25519:secp384r1;

        limit_conn perip 15;

        # static
        location / {
            try_files $uri $uri/ /index.html;
        }

        error_page 404 /404.html;
            location = /40x.html {
        }

        error_page 500 502 503 504 /50x.html;
            location = /50x.html {
        }
    }

}
