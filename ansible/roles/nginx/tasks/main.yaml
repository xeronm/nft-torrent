- name: "Nginx conf.d path"
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: 0755
  loop:
    - /etc/nginx/conf.d
  tags: nginx

- name: 'Nginx user group'
  group:
    name: nginx
    state: present
  tags: nginx

- name: Nginx user
  user:
    name: nginx
    state: present
    groups:
      - nginx
    create_home: no
    append: yes
  tags: nginx

- name: Nginx is configured
  copy:
    src: ./etc/nginx/nginx.conf
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: 0644
  notify:
    - restart nginx
  tags: nginx

- name: GeoIP
  include_tasks:
    file: geoip.yaml
    apply:
      tags: nginx
  when: webserver.geoip
  tags:
    - nginx
    - geoip

- name: '"Nginx" service'
  include_tasks:
    file: ./../common/tasks/service.yaml
    apply:
      tags: nginx
  vars:
    service:
      name: nginx
      package: nginx
      exclude:
      params: "{{ nginx.service_params }}"
  tags: nginx

