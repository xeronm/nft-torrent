- name: "RedHat: Nginx Firewall services"
  firewalld:
    service: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop:
    - http
    - https
  when: ansible_os_family == "RedHat"
  tags: nginx

- name: "Debian: Nginx Firewall through UFW"
  ansible.builtin.ufw:
    rule: allow
    name: "{{ item }}"
  loop:
    - http
    - https
  when: ansible_os_family == "Debian"
  tags: nginx

- name: Set httpd_can_network_connect flag on and keep it persistent across reboots
  seboolean:
    name: httpd_can_network_connect
    state: yes
    persistent: yes
  when: ansible_os_family == "RedHat"
  tags: nginx

