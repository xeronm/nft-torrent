[tox]
skipsdist = True
envlist =
        {py310},
        isort, flake

[flake8]
max-complexity = 24
max-line-length = 119
exclude =

[coverage:run]
omit =
        */test/*
        __meta__.py
source =
        NFTorrent

[coverage:report]
fail_under = 80.00
precision = 2
exclude_lines =
        pragma: no cover
        @abc.abstractmethod


[testenv]
commands =
        python3 -m unittest {posargs}
passenv =
        CI_*
        PIP_*
setenv =
deps =
        pytest
        -rrequirements.txt

[testenv:coverage]
commands =
        coverage run -m unittest {posargs}
commands_post =    
        coverage report
        coverage html --directory={toxworkdir}/{envname}/htmlcov
        coverage json -o {toxworkdir}/{envname}/coverage.json
deps =
        coverage~=7.0.0
        -rrequirements.txt

[testenv:isort]
; check that imports are sorted alphabetically
commands =
        isort --check-only --diff nwm_dashboard tests {posargs}
deps =
        isort
 
[testenv:flake]
; Style Guide Enforcement
commands =
        flake8 NFTorrent tests {posargs}
deps =
        flake8       

[testenv:server]
setenv = 
        LOGURU_LEVEL=INFO
        STORAGE_CLI_BINARY=/mnt/c/Work/ton-storage/storage-daemon-cli.exe
        STORAGE_DAEMON_ADDR=172.19.96.1:5555
        STORAGE_DB_PATH=C:/Work/ton-storage/storage-db
        STORAGE_DB_TORRENT_PATH=/mnt/c/Work/ton-storage/storage-db/torrent/torrent-files
        STORAGE_MANIFEST_BAG_ID=A8C27C0AF2BB3A3077330F1857C3130F6EBEEE5BD5347A18F1A4CCD30D4F5F82
        STORAGE_NUM_WORKERS=4
        STORAGE_MIN_REDUNDANCY=1
        STORAGE_CONFIRMATION_TIMEOUT=20
        TON_API_TONLIB_LITESERVER_CONFIG=https://ton.org/testnet-global-config.json
        TON_API_TONLIB_KEYSTORE={toxworkdir}/.ton_keystore/
commands = 
        fastapi --verbose dev NFTorrent
deps =
        fastapi-cli
        -rrequirements.txt

