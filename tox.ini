[tox]
envlist =
        {py310},
        format, lint

[coverage:run]
omit =
        */test/*
        NFTorrent/__meta__.py
        NFTorrent/main.py
source =
        NFTorrent

[coverage:report]
fail_under = 80.00
precision = 2
exclude_lines =
        pragma: no cover
        @abc.abstractmethod

[docker:cache]
image = redis:latest
expose =
        CACHE_REDIS_PORT=6379/tcp

[docker:db]
image = postgres:latest
environment =
        POSTGRES_PASSWORD=postgres
        POSTGRES_USER=postgres
expose =
        INDEXDB_DATABASE_PORT=5432/tcp

[testenv]
basepython = python3.10
commands =
        python3 -m unittest {posargs}
passenv =
        CI_*
        PIP_*
setenv =
deps =
        pytest

[testenv:coverage]
skip_install = true
commands =
        coverage run -m unittest {posargs}
commands_post =
        coverage report
        coverage html --directory={toxworkdir}/{envname}/htmlcov
        coverage json -o {toxworkdir}/{envname}/coverage.json
deps =
        coverage~=7.0.0


[testenv:format]
description = Run code formatters (black, isort)
skip_install = true
deps =
    black
    isort
commands =
    isort NFTorrent test
    black NFTorrent test


[testenv:lint]
description = Run ruff for linting, complexity, and style checks
skip_install = true
deps =
    ruff
commands =
    ruff check NFTorrent test


[testenv:server]
; docker =
;         db
;         cache
setenv =
        UVICORN_LOG_LEVEL=trace
        LOGGER_CONFIG=NFTorrent.logger.config
        TONLIB_LITESERVER_CONFIG=https://ton.org/testnet-global.config.json
        TONLIB_KEYSTORE={toxworkdir}/.ton_keystore/
        ; TONLIB_MAX_LITESERVERS=1
        TONLIB_REQUEST_TIMEOUT=20
        ; TONLIB_VERBOSITY_LEVEL=4
        CACHE_ENABLED={env:CI_CACHE_ENABLED:1}
        ; CACHE_REDIS_ENDPOINT={env:CI_CACHE_HOST:127.0.0.1}
        ; CACHE_REDIS_TIMEOUT=2
        INDEXDB_ENABLED={env:CI_INDEXDB_ENABLED:1}
        INDEXDB_INDEXER_TIMEOUT=10
        INDEXDB_DATABASE_HOST=172.16.1.1
        INDEXDB_DATABASE_PORT=6432
        INDEXDB_DATABASE_PASSWORD=5o1wjdkE0VQXdRLU8m3rV7aa
        ; INDEXDB_ETCD_HOSTS=172.16.1.1:2379
        ; INDEXDB_ETCD_CACERT=./ansible/inventory/certs/pgcluster/ca.crt
        ; INDEXDB_ETCD_CERT=./ansible/inventory/certs/pgcluster/client.crt
        ; INDEXDB_ETCD_KEY=./ansible/inventory/certs/pgcluster/client.key
        ; HTTP_API_ROOT_PATH=/nftorrent
        IPFS_ENABLED=1
        IPFS_KUBO_RPC_URI=http://172.16.1.1:9095
        IPFS_CLUSTER_RPC_URI=http://172.16.1.1:9094
        IPFS_MIN_REDUNDANCY=2
        IPFS_CONFIRMATION_TIMEOUT=20
        HTTP_API_JWT_SECRET=f53c1ba73b3d00ee88335fb690e6832b72e6a73094e2903661abc2f9bc72d414
        HTTP_VERIFY_SSL=0
        HTTP_ENABLE_SSL=1
        HTTP_TWA_DOMAINS=localhost:9000
        ; HTTP_TWA_BOT_TOKEN=
        HTTP_ALLOW_NETWORKS=127.0.0.1/32
        HTTP_REMOTE_API_ROOT=/nftorrent
commands =
        uvicorn --log-level info --reload --reload-dir ./NFTorrent NFTorrent.main:app
deps =
        uvicorn


[testenv:build]
skip_install = true
description = Build python package
deps =
        setuptools
        wheel
        build
        babel
commands =
        pybabel compile -d NFTorrent/locales
        python3 -m build



[testenv:image]
skip_install = true
description = Build docker image
depends =
       build
allowlist_externals =
        docker
setenv =
        TON_RELEASE={env:CI_TON_RELEASE:v2025.04}
        IMAGE_NFTORRENT={env:CI_IMAGE_NFTORRENT:nft-torrent}
        file|./NFTorrent/__meta__.py
deps =
commands =
        docker build ./docker -t {env:IMAGE_NFTORRENT}:{env:__version__} \
                --build-context dist=./dist \
                --build-arg NFTORRENT_VERSION={env:__version__} \
                --build-arg TON_RELEASE={env:TON_RELEASE}
