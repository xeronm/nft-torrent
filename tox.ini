[testenv:build]
description = Build python package
deps =
       setuptools
       wheel
       build
commands =
       python3 -m build

[testenv:image]
skip_install = true
description = Build docker image
depends =
       build
allowlist_externals =
        docker
setenv =
        TON_RELEASE={env:CI_TON_RELEASE:v2025.03}
        IMAGE_NFTORRENT={env:CI_IMAGE_NFTORRENT:nft-torrent}
        file|./NFTorrent/__meta__.py
deps =       
commands =
        docker build ./docker -t {env:IMAGE_NFTORRENT}:{env:__version__} \
                --build-context dist=./dist \
                --build-arg NFTORRENT_VERSION={env:__version__} \
                --build-arg TON_RELEASE={env:TON_RELEASE}
